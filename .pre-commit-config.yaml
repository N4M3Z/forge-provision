repos:
    - repo: builtin
      hooks:
          - id: trailing-whitespace
          - id: check-yaml
            exclude: ^templates/
          - id: check-json

    - repo: local
      hooks:
          - id: shellcheck
            name: shellcheck
            entry: shellcheck -S warning
            language: system
            types: [shell]

          - id: ruff
            name: ruff check
            entry: ruff check
            language: system
            types: [python]

          - id: gitleaks
            name: gitleaks
            entry: gitleaks git --no-banner .
            language: system
            pass_filenames: false
            stages: [pre-push]

          - id: semgrep
            name: semgrep OWASP
            entry: semgrep scan --config=p/owasp-top-ten --metrics=off --quiet .
            language: system
            pass_filenames: false
            stages: [pre-push]

          - id: tldr-pages
            name: validate tldr pages
            entry: scripts/validate/tldr-pages.sh
            language: system
            pass_filenames: false
            files: ^(docs/tldr-pages/|scripts/(configure|validate|verify)/tldr-pages\.sh$)

          - id: forge-validate
            name: forge validate
            entry: forge validate
            language: system
            pass_filenames: false
