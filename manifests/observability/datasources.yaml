apiVersion: 1

# Grafana provisioning: both backends wired at startup so no click-through setup is
# needed on a fresh machine. Prometheus is the default so the community Claude Code
# dashboards resolve without editing panels.
#
# The uid values are fixed rather than generated: provisioned dashboards reference
# their datasource by uid, so a random one would break every panel on reinstall.
datasources:
    - name: Prometheus
      uid: forge-prometheus
      type: prometheus
      access: proxy
      url: http://127.0.0.1:9090
      isDefault: true
      editable: false

    - name: VictoriaLogs
      uid: forge-victorialogs
      type: victoriametrics-logs-datasource
      access: proxy
      url: http://127.0.0.1:9428
      editable: false
