apiVersion: 1

# File-backed dashboards: Grafana loads them from disk at startup and keeps them in
# sync, so the dashboard set is provisioned rather than hand-imported. foldersFromFilesStructure
# is off; everything lands in one folder named for the source.
providers:
    - name: forge
      orgId: 1
      folder: AI Harnesses
      type: file
      disableDeletion: false
      updateIntervalSeconds: 60
      allowUiUpdates: true
      options:
          path: /opt/homebrew/etc/grafana/dashboards/forge
          foldersFromFilesStructure: false
