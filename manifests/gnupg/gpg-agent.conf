# Rendered to ~/.gnupg/gpg-agent.conf by scripts/configure/gnupg.sh — the
# pinentry path becomes a literal at render time, because GnuPG conf files do
# not shell-expand.
#
# Cache-TTL options are deliberately absent: they govern passphrase caching
# for on-disk keys and do nothing for card-held keys. The card holds PIN
# verification itself, from first use until unplugged.
# Decision: docs/decisions/ARCH-0006 Commit signing.md

pinentry-program ${BREW_PREFIX}/bin/pinentry-mac
