# Resolve every *.internal name to loopback, where Caddy fronts the local
# services. Deployed to $(brew --prefix)/etc/dnsmasq.d/ by
# scripts/configure/local-names.sh; the brew service includes that directory
# via `-7 .../dnsmasq.d,*.conf`.
#
# Port 5354, not 53: binding a high port needs no root, so dnsmasq runs as a
# user LaunchAgent, and nothing can contend with another resolver for 53.
# /etc/resolver/internal carries the matching `port 5354` line.
#
# Source: https://github.com/N4M3Z/forge-provision

port=5354
listen-address=127.0.0.1
bind-interfaces

# Answer only for .internal. With no upstream servers configured this can never
# act as a general resolver, even if something pointed at it directly.
no-resolv
address=/internal/127.0.0.1
